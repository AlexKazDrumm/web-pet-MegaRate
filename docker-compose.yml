services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-megarate}
      POSTGRES_USER: ${POSTGRES_USER:-megarate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-megarate_local}
    volumes:
      - megarate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-megarate} -d ${POSTGRES_DB:-megarate}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-megarate}:${POSTGRES_PASSWORD:-megarate_local}@db:5432/${POSTGRES_DB:-megarate}
      CORS_ORIGIN: http://localhost:8080
      KINOP_API500_KEY: ${KINOP_API500_KEY:-}
      KINOP_API200_KEY: ${KINOP_API200_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "8080:80"
volumes:
  megarate-db:
